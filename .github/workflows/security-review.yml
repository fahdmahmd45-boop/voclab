name: Security review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete checked-out history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan all reachable Git history, not only the PR diff
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_BIN="$(find /tmp -type f -path '*/gitleaks-*/gitleaks' -print -quit)"
          if [ -z "$GITLEAKS_BIN" ]; then
            echo "Gitleaks executable not available"
            exit 1
          fi
          "$GITLEAKS_BIN" detect --source . --redact --no-banner --exit-code 2
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit --audit-level=high --omit=dev
      - run: npm install --ignore-scripts
      - run: node --test tests/security-uploads.test.js
      - run: node --check api/ai.js
      - run: node --check api/_security.js
      - run: node --check api/_file-text.js
      - run: node --check assets/inline-script-1.js
