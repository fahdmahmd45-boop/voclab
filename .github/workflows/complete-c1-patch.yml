name: Integrate complete Oxford C1

on:
  push:
    branches: [feat/complete-oxford-c1]
    paths:
      - .github/workflows/complete-c1-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-oxford-c1

      - name: Integrate C1 data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          scripts = '''<script src="/data/c1-a-d.js"></script>
          <script src="/data/c1-e-h.js"></script>
          <script src="/data/c1-i-m.js"></script>
          <script src="/data/c1-n-r.js"></script>
          <script src="/data/c1-s-z.js"></script>
          '''
          marker = '</main>\n<script>\n'
          if '/data/c1-a-d.js' not in s:
              if marker not in s:
                  raise SystemExit('main script marker not found')
              s = s.replace(marker, '</main>\n' + scripts + '<script>\n', 1)

          merge_block = '''if (Array.isArray(window.VOCLAB_C1_OFFICIAL)) {
            const c1Seen = new Set(OXR.filter(w => w[0] === 'OC1').map(w => String(w[1] || '').toLowerCase()));
            for (const w of window.VOCLAB_C1_OFFICIAL) {
              const key = String(w && w[1] || '').toLowerCase();
              if (!key || c1Seen.has(key)) continue;
              OXR.push(w);
              c1Seen.add(key);
            }
          }
          '''
          ox_marker = 'const OX=OXR.map(w=>{const k=w[0]+"|"+w[1];return[w[0],w[1],w[2],w[3],OXEX[k]||""]});'
          ox_replacement = merge_block + 'const OX=OXR.map(w=>{const k=w[0]+"|"+w[1];return[w[0],w[1],w[2],w[3],OXEX[k]||w[4]||""]});'
          if 'window.VOCLAB_C1_OFFICIAL' not in s:
              if ox_marker not in s:
                  raise SystemExit('OX mapping marker not found')
              s = s.replace(ox_marker, ox_replacement, 1)
          elif 'OXEX[k]||w[4]||""' not in s:
              s = s.replace('OXEX[k]||""]});', 'OXEX[k]||w[4]||""]});', 1)

          p.write_text(s, encoding='utf-8')

          # Two small example/type consistency fixes in learner-aid data.
          fixes = {
              Path('data/c1-a-d.js'): (
                  'combat\\tn\\tمكافحة / قتال\\tThe campaign aims to combat online fraud.',
                  'combat\\tn\\tقتال / مواجهة\\tThe unit received training for close combat.'
              ),
              Path('data/c1-s-z.js'): (
                  'tackle\\tn\\tعدة / معالجة\\tThe team needs a new approach to tackle the issue.',
                  'tackle\\tn\\tعدة / معدات\\tThe fishing tackle was stored in a box.'
              )
          }
          for fp, (old, new) in fixes.items():
              text = fp.read_text(encoding='utf-8')
              if old in text:
                  fp.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate C1 data and JavaScript
        shell: bash
        run: |
          for f in data/c1-a-d.js data/c1-e-h.js data/c1-i-m.js data/c1-n-r.js data/c1-s-z.js; do
            node --check "$f"
          done

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const ctx = { window: {} };
          vm.createContext(ctx);
          for (const f of ['data/c1-a-d.js','data/c1-e-h.js','data/c1-i-m.js','data/c1-n-r.js','data/c1-s-z.js']) {
            vm.runInContext(fs.readFileSync(f, 'utf8'), ctx, { filename: f });
          }
          const rows = ctx.window.VOCLAB_C1_OFFICIAL || [];
          const allowed = new Set(['n','v','adj','adv','phr','conj','prep','pron','det','num','excl','modal','art']);
          if (rows.length < 1200) throw new Error(`C1 dataset unexpectedly small: ${rows.length}`);
          for (const [i,row] of rows.entries()) {
            if (!Array.isArray(row) || row.length !== 5) throw new Error(`Bad row ${i}`);
            if (row[0] !== 'OC1') throw new Error(`Bad unit at row ${i}`);
            if (!row[1] || !allowed.has(row[2]) || !row[3] || !row[4]) throw new Error(`Incomplete row ${i}: ${JSON.stringify(row)}`);
          }
          const unique = new Set(rows.map(r => String(r[1]).toLowerCase()));
          console.log(`C1_DATA_ROWS=${rows.length}`);
          console.log(`C1_UNIQUE_HEADWORDS=${unique.size}`);
          console.log(`C1_DUPLICATE_SENSE_ROWS=${rows.length - unique.size}`);
          NODE

          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/voclab-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/voclab-inline.js
          git diff --check

      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "voclab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/c1-a-d.js data/c1-e-h.js data/c1-i-m.js data/c1-n-r.js data/c1-s-z.js
          git rm .github/workflows/complete-c1-patch.yml
          git commit -m "Complete Oxford C1 vocabulary"
          git push origin feat/complete-oxford-c1
