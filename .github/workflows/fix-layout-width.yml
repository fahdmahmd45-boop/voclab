name: Fix layout width stability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-layout-width.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Stabilize page sizing across panels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="html{-webkit-text-size-adjust:100%}\nbody{font-family:var(--ui);background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px;line-height:1.5}"
          new="html{-webkit-text-size-adjust:100%;width:100%;overflow-x:hidden;scrollbar-gutter:stable}\nbody{font-family:var(--ui);background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;width:100%;overflow-x:hidden;font-size:15px;line-height:1.5}"
          if old not in s: raise SystemExit('base layout CSS anchor not found')
          s=s.replace(old,new,1)
          old2="main{max-width:860px;margin:0 auto;padding:18px 16px 60px}\n.panel{display:none}.panel.on{display:block;animation:fadeUp .3s ease}"
          new2="main{width:100%;max-width:860px;min-width:0;margin:0 auto;padding:18px 16px 60px;min-height:calc(100dvh - 110px)}\n.panel{display:none;width:100%;min-width:0}.panel.on{display:block;animation:fadeUp .3s ease}"
          if old2 not in s: raise SystemExit('main/panel CSS anchor not found')
          s=s.replace(old2,new2,1)
          s=s.replace('.fcwrap{max-width:500px;margin:0 auto;text-align:center}', '.fcwrap{width:100%;max-width:560px;margin:0 auto;text-align:center}',1)
          s=s.replace('.qwrap{max-width:540px;margin:0 auto}', '.qwrap{width:100%;max-width:560px;margin:0 auto}',1)
          s=s.replace('.home{max-width:560px;margin:0 auto}', '.home{width:100%;max-width:560px;margin:0 auto}',1)
          s=s.replace('.dwrap{max-width:560px;margin:0 auto}', '.dwrap{width:100%;max-width:560px;margin:0 auto}',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate layout patch
        run: |
          grep -F "scrollbar-gutter:stable" index.html
          grep -F ".fcwrap{width:100%;max-width:560px" index.html
          grep -F ".qwrap{width:100%;max-width:560px" index.html
          grep -F "min-height:calc(100dvh - 110px)" index.html
          git diff --check
      - name: Commit fix and clean helper
        run: |
          rm -f .github/workflows/fix-layout-width.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "fahdmahmd45-boop"
          git config user.email "fahdmahmd45@gmail.com"
          git add -A
          git commit -m "Stabilize panel sizing across navigation"
          git push origin main
