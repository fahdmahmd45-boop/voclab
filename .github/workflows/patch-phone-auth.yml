name: Patch phone auth loader

on:
  push:
    branches:
      - feature/phone-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phone-auth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch index
        run: node scripts/patch-phone-auth.js
      - name: Validate scripts
        run: |
          node --check auth.js
          node --check scripts/patch-phone-auth.js
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Supabase phone auth"
          git push origin HEAD:feature/phone-auth
