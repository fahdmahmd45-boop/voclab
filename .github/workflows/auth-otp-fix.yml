name: Fix auth OTP input

on:
  push:
    branches: [main]
    paths:
      - '.github/auth_otp_fix.py'
      - '.github/workflows/auth-otp-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch auth OTP UI
        run: python3 .github/auth_otp_fix.py
      - name: Validate JavaScript
        run: node --check auth.js
      - name: Validate diff
        run: git diff --check
      - name: Commit fix and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth.js
          git rm .github/auth_otp_fix.py .github/workflows/auth-otp-fix.yml
          git commit -m "Fix email OTP input stability"
          git push origin main
