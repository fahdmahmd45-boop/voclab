<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENG</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0E11; --hd:#101216; --card:#15171C; --card2:#1B1E24; --line:#262A32;
  --tx:#E9E9E5; --mut:#8E929B; --amber:#D3A45A; --onacc:#171310;
  --ok:#4EB388; --bad:#E0604E; --blue:#5CA8D8;
  --en:'Newsreader',Georgia,serif; --ui:'Inter',-apple-system,'Segoe UI',sans-serif; --ar:'IBM Plex Sans Arabic',sans-serif;
  --r:14px; --shadow:none;
}
body.light{
  --bg:#F5F3EE; --hd:#FCFBF7; --card:#FFFFFF; --card2:#F0EDE5; --line:#E4E0D5;
  --tx:#1E1F23; --mut:#72757C; --amber:#9C7228; --onacc:#FFFFFF;
  --ok:#2F8F63; --bad:#C24936; --blue:#3D7FAD;
  --shadow:0 1px 2px rgba(30,25,10,.05),0 4px 14px rgba(30,25,10,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px;line-height:1.5}
::selection{background:var(--amber);color:var(--onacc)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
button{font-family:var(--ui);color:inherit}

/* ---- header ---- */
header{position:sticky;top:0;z-index:30;background:var(--hd);border-bottom:1px solid var(--line);padding:14px 18px;backdrop-filter:blur(8px)}
.hwrap{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--en);font-size:24px;font-weight:600;letter-spacing:.5px;line-height:1}
h1 .tld{color:var(--amber)}
h1 small{display:block;font-family:var(--ui);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:5px}
.prog{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.prog b{font-family:var(--en);font-size:19px;color:var(--tx);font-weight:600}
.prog span{display:inline}
.prog > span:last-of-type{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.pbar{position:absolute;left:0;bottom:-1px;width:100%;height:2px;background:transparent;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--amber);width:0%;transition:width .6s cubic-bezier(.3,.7,.3,1)}
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.iconbtn:hover{border-color:var(--amber)}
.iconbtn:active{transform:scale(.97)}
.iconbtn svg{flex:none}

/* ---- layout ---- */
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.panel{display:none}.panel.on{display:block;animation:fadeUp .3s ease}

/* ---- tabs (segmented) ---- */
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;white-space:nowrap;padding:9px 13px;border:none;background:transparent;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--mut);transition:color .15s,background .15s}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--amber);color:var(--onacc);font-weight:600}

/* ---- drawer ---- */
.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;background:var(--hd);border-right:1px solid var(--line);z-index:50;transform:translateX(-100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);padding:22px 18px;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer h2{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.drawer .filters{flex-direction:column;align-items:stretch;margin-bottom:0}
.drawer select,.drawer .search{width:100%}
.overlay{position:fixed;inset:0;background:rgba(8,8,10,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,.search,.tin,.myin{font-family:var(--ui);font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);outline:none;transition:border-color .15s}
select:focus,.search:focus,.tin:focus,.myin:focus{border-color:var(--amber)}
.search{flex:1;min-width:150px}

/* ---- browse rows ---- */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:8px;box-shadow:var(--shadow);animation:fadeUp .35s ease both;transition:border-color .15s}
.row:hover{border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .w{font-family:var(--en);font-size:20px;font-weight:600}
.row .t{font-size:10.5px;font-weight:500;letter-spacing:.04em;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:6px;padding:2px 7px}
.row .m{font-family:var(--ar);font-size:15px;direction:rtl}
.row .u{font-size:11px;color:var(--mut);margin-inline-start:auto}
.row .ex{font-family:var(--en);font-style:italic;font-size:15px;color:var(--mut);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.row .ex b{color:var(--amber);font-weight:600;font-style:normal}
.spk{border:none;background:none;cursor:pointer;color:var(--mut);display:inline-flex;align-items:center;vertical-align:middle;padding:2px;transition:color .15s}
.spk:hover{color:var(--amber)}
.kbtn,.delbtn{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:4px 11px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx);transition:border-color .15s}
.kbtn:hover{border-color:var(--amber)}
.delbtn{color:var(--bad)}
.row.known{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.row.known .kbtn{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}

/* ---- flashcards ---- */
.fcwrap{max-width:500px;margin:0 auto;text-align:center}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:28px;cursor:pointer;position:relative;box-shadow:var(--shadow)}
.fcard .word{font-family:var(--en);font-size:46px;font-weight:600;letter-spacing:-.01em}
.fcard .type{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.fcard .ans{font-family:var(--ar);font-size:25px;font-weight:500;color:var(--amber);direction:rtl}
.fcard .fex{font-family:var(--en);font-style:italic;font-size:16px;color:var(--mut);line-height:1.55}
.fcard .fex b{color:var(--tx);font-style:normal}
.fcard .hint{position:absolute;bottom:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.fcard3{position:relative;min-height:310px;perspective:1200px;cursor:pointer;animation:fadeUp .35s ease both}
.fcface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .55s cubic-bezier(.35,.1,.25,1)}
.fcb{transform:rotateY(180deg)}
.fcard3.flipped .fcface:first-child{transform:rotateY(-180deg)}
.fcard3.flipped .fcb{transform:rotateY(0)}
.fcbtns{display:flex;gap:10px;margin-top:16px}
.fcbtns button{flex:1;padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .1s,filter .15s}
.fcbtns button:active{transform:scale(.97)}
.bok{background:var(--ok);color:#fff}
.bno{background:var(--bad);color:#fff}
.bskip{background:var(--card);border:1px solid var(--line)!important;color:var(--tx);display:flex;align-items:center;justify-content:center;flex:0 0 54px}
.counter{margin-top:12px;font-size:12px;letter-spacing:.06em;color:var(--mut)}

/* ---- quiz ---- */
.qwrap{max-width:540px;margin:0 auto}
.qword{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:14px;box-shadow:var(--shadow)}
.qword .word{font-family:var(--en);font-size:38px;font-weight:600}
.qword .type{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.qword .qex{font-family:var(--en);font-style:italic;font-size:15px;color:var(--mut);margin-top:10px}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:8px;font-family:var(--ar);font-size:16px;cursor:pointer;direction:rtl;animation:fadeUp .3s ease both;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--amber)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);font-weight:700;animation:pulse .4s ease}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.next{width:100%;padding:13px;border-radius:12px;border:none;background:var(--amber);color:var(--onacc);font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:filter .15s,transform .1s}
.next:hover{filter:brightness(1.06)}
.next:active{transform:scale(.985)}
.score{text-align:center;font-size:12.5px;color:var(--mut);margin-top:10px}

/* ---- spelling ---- */
.tprompt{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:14px;box-shadow:var(--shadow)}
.tprompt .m{font-family:var(--ar);font-size:24px;font-weight:500;color:var(--amber);direction:rtl}
.tprompt .type{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.tprompt .bex{font-family:var(--en);font-style:italic;font-size:16px;color:var(--mut);margin-top:12px;line-height:1.55}
.tprompt .bex b{color:var(--tx);letter-spacing:2px;font-style:normal}
.tin{width:100%;padding:14px;border-width:2px;border-radius:12px;font-family:var(--en);font-size:21px;text-align:center}
.tin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.tin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.tfeed{text-align:center;min-height:26px;margin-top:10px;font-size:16px;font-weight:600}

/* ---- shared states ---- */
.done{text-align:center;padding:44px 20px}
.done .big{display:flex;justify-content:center;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.done p{margin-top:14px;font-size:16px}
.praise{color:var(--amber);font-weight:600;font-family:var(--en);font-style:italic;font-size:17px;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:34px 10px 20px;font-size:15px}

/* ---- my words ---- */
.myform{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.myform h3{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;color:var(--mut)}
.mygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mygrid .full{grid-column:1/-1}
.myin{width:100%}
.myin[dir=rtl]{font-family:var(--ar)}
.addbtn{grid-column:1/-1;padding:12px;border-radius:10px;border:none;background:var(--amber);color:var(--onacc);font-weight:600;font-size:14px;cursor:pointer}

/* ---- home ---- */
.home{max-width:560px;margin:0 auto}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);animation:fadeUp .35s ease both}
.hgreet{font-family:var(--en);font-size:30px;font-weight:600;margin-top:6px;animation:fadeUp .4s ease both}
.hquote{font-family:var(--en);font-style:italic;font-size:17.5px;line-height:1.5;color:var(--mut);margin:10px 0 20px;animation:fadeUp .5s ease both}
.hquote::before{content:'\201C';color:var(--amber);margin-right:2px}
.hquote::after{content:'\201D';color:var(--amber);margin-left:2px}
.hprog{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:13.5px;margin-bottom:22px;box-shadow:var(--shadow);animation:fadeUp .55s ease both}
.hprog b{font-family:var(--en);font-size:17px}
.hprog .pbar{position:static;height:5px;background:var(--card2);border-radius:99px;margin-top:10px;width:auto}
.hprog .pbar i{border-radius:99px}
.hhead{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}
.hhead h3{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 15px;cursor:pointer;box-shadow:var(--shadow);animation:fadeUp .4s ease both;transition:transform .15s,border-color .15s}
.hcard:hover{border-color:var(--amber)}
.hcard:active{transform:scale(.96)}
.lvl{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:7px}
.lv-n{color:var(--mut);background:var(--card2)}
.lv-a1{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.lv-a2{color:var(--blue);background:color-mix(in srgb,var(--blue) 13%,transparent)}
.lv-b1{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.lv-b2{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.lv-my{color:var(--tx);background:var(--card2)}
.ht{font-weight:600;font-size:15px;margin-top:10px}
.hsub{font-size:11.5px;color:var(--mut);margin-top:2px}
.hcount{font-size:11.5px;color:var(--mut);margin-top:10px;font-variant-numeric:tabular-nums}
.hbar{height:4px;background:var(--card2);border-radius:99px;margin-top:6px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .6s ease}
.delbadge{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;border:none;background:var(--bad);color:#fff;font-size:13px;cursor:pointer;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.wig{animation:wig .35s ease-in-out infinite!important}
.hrestore{display:flex;flex-wrap:wrap;gap:8px}
.rchip{background:var(--card);border:1px dashed var(--line);color:var(--mut);border-radius:99px;padding:8px 13px;font-size:12.5px;cursor:pointer;transition:color .15s,border-color .15s}
.rchip:hover{color:var(--tx);border-color:var(--amber)}


/* ---- dictionary ---- */
.dwrap{max-width:560px;margin:0 auto}
.dsearch{display:flex;gap:8px;margin-bottom:14px}
.dsearch .search{flex:1;font-size:16px}
.dbtn{width:auto;margin:0;padding:10px 20px;flex:none}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);animation:fadeUp .35s ease both}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dword{font-family:var(--en);font-size:34px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.dphon{color:var(--mut);font-size:14px;margin-top:4px}
.dar{font-family:var(--ar);direction:rtl;text-align:right;font-size:19px;color:var(--amber);margin:12px 0 4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dpos{margin-top:14px}
.dposname{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.dpos ul{list-style:none}
.dpos li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.dpos li:last-child{border-bottom:none}
.dex{font-family:var(--en);font-style:italic;color:var(--mut);font-size:14px;margin-top:3px}
.dsyn{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}


/* ---- name onboarding ---- */
.nameov{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeUp .35s ease}
.namecard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 26px;text-align:center;box-shadow:var(--shadow)}
.nbrand{font-family:var(--en);font-size:32px;font-weight:600;margin-bottom:16px}
.nbrand .tld{color:var(--amber)}
.namecard h2{font-family:var(--en);font-size:22px;font-weight:600}
.namecard p{color:var(--mut);font-size:14px;margin:6px 0 18px}
.namecard .search{width:100%;text-align:center;font-size:16px;margin-bottom:12px}

/* ---- motion ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wig{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
body,header,.row,.fcard,.qword,.tprompt,.opt,.tab,select,.search,.tin,.myin,.drawer,.iconbtn,.hcard,.hprog{transition-property:background-color,color,border-color;transition-duration:.3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:540px){
  .row .w{font-size:17.5px}
  .fcard .word{font-size:36px}
  .mygrid{grid-template-columns:1fr}
  h1{font-size:21px}
  .prog b{font-size:16px}
}
button,.rchip,.kbtn,.delbtn,.spk,.iconbtn,.addbtn,.next,.opt,.tab{transition:transform .12s ease,filter .12s ease}
button:active,.rchip:active,.kbtn:active,.opt:active,.tab:active{transform:scale(.93);filter:brightness(1.15)}
.addbtn:active,.next:active{transform:scale(.97)}
.click-pulse{position:fixed;width:16px;height:16px;border-radius:50%;background:var(--amber,#D0AF7A);pointer-events:none;z-index:9999;opacity:.5;transform:translate(-50%,-50%) scale(1);animation:pulseOut .5s ease-out forwards}
@keyframes pulseOut{to{transform:translate(-50%,-50%) scale(4.5);opacity:0}}
.row,.dcard,.myform{animation:fadeUp .35s ease both}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1>ENG<span class="tld">.</span><small>English vocabulary trainer</small></h1>
    <div class="hbtns"><button class="iconbtn" id="btnDrawer" title="Filters"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></svg><span>Filters</span></button><button class="iconbtn" id="btnTheme" title="Theme"></button></div>
    <div class="prog"><b id="pKnown">0</b> / <span id="pTotal" style="display:inline">0</span><span>words mastered</span>
      <div class="pbar"><i id="pFill"></i></div>
    </div>
  </div>
</header>
<aside class="drawer" id="drawer">
  <h2>Filters</h2>
  <div class="filters">
    <select id="fSrc">
      <option value="all">All decks</option>
      <option value="O">Oxford 3000 (A1–B2)</option>
      <option value="M">My Words</option>
      <option value="C">Custom decks</option>
    </select>
    <select id="fUnit"><option value="all">All units</option></select>
    <select id="fKnown">
      <option value="all">All words</option>
      <option value="no">Not mastered</option>
      <option value="yes">Mastered</option>
    </select>
    <input class="search" id="fSearch" placeholder="Search a word...">
  </div>
  <button class="next" style="margin-top:14px" onclick="closeDrawer()">Apply</button>
</aside>
<div class="overlay" id="overlay"></div>
<main>
  
  <div class="tabs">
    <button class="tab on" data-p="home">Home</button>
    <button class="tab" data-p="dict">Dictionary</button>
    <button class="tab" data-p="list">Browse</button>
    <button class="tab" data-p="cards">Flashcards</button>
    <button class="tab" data-p="mcq">Quiz</button>
    <button class="tab" data-p="type">Spelling</button>
    <button class="tab" data-p="my">My Words</button>
  </div>
  <div class="panel on" id="p-home"></div>
  <div class="panel" id="p-dict"></div>
  <div class="panel" id="p-list"></div>
  <div class="panel" id="p-cards"></div>
  <div class="panel" id="p-mcq"></div>
  <div class="panel" id="p-type"></div>
  <div class="panel" id="p-my"></div>

let streak=JSON.parse(store.get('engl01_streak')||'{"last":"","count":0,"best":0}');
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function markStudy(){
  const today=todayStr();
  if(streak.last===today)return;
  const y=new Date();y.setDate(y.getDate()-1);
  streak.count=(streak.last===todayStr(y))?streak.count+1:1;
  streak.last=today;
  if(streak.count>streak.best)streak.best=streak.count;
  store.set('engl01_streak',JSON.stringify(streak));
  const el=document.getElementById('streakBox');if(el)el.outerHTML=streakHTML();
}
function streakLive(){
  /* streak is alive if last study was today or yesterday */
  if(!streak.last)return 0;
  const today=todayStr(),y=new Date();y.setDate(y.getDate()-1);
  return(streak.last===today||streak.last===todayStr(y))?streak.count:0;
}
function streakHTML(){
  const c=streakLive();
  const doneToday=streak.last===todayStr();
  return `<div id="streakBox" style="display:flex;align-items:center;gap:10px;margin:14px 0;padding:12px 16px;border:1px solid ${doneToday?'#D0AF7A':'rgba(128,128,128,.25)'};border-radius:14px">

      <div style="font-size:12.5px;opacity:.7">${doneToday?'You studied today \u2713':'Study today to keep it going'}${streak.best>1?' \u00b7 Best: '+streak.best:''}</div>
    </div>
  </div>`;
}

let _actx=null;
function _ac(){if(!_actx){try{_actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(_actx&&_actx.state==='suspended')_actx.resume();return _actx}
// warm bell-like note: sine fundamental + soft octave overtone, filtered, with a natural pluck envelope
function _note(freq,start,dur,peak){
  const ctx=_ac();if(!ctx)return;
  const t0=ctx.currentTime+start;
  const master=ctx.createGain();
  master.gain.setValueAtTime(0,t0);
  master.gain.linearRampToValueAtTime(peak!=null?peak:.22,t0+.008);
  master.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=freq*4.5;filt.Q.value=.7;
  filt.connect(master);master.connect(ctx.destination);
  const o1=ctx.createOscillator();o1.type='sine';o1.frequency.setValueAtTime(freq,t0);
  const g1=ctx.createGain();g1.gain.value=1;o1.connect(g1);g1.connect(filt);
  const o2=ctx.createOscillator();o2.type='sine';o2.frequency.setValueAtTime(freq*2,t0);
  const g2=ctx.createGain();g2.gain.value=.16;o2.connect(g2);g2.connect(filt);
  o1.start(t0);o1.stop(t0+dur+.05);
  o2.start(t0);o2.stop(t0+dur+.05);
}
function _thud(freq,start,dur,peak){
  const ctx=_ac();if(!ctx)return;
  const t0=ctx.currentTime+start;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(freq,t0);osc.frequency.exponentialRampToValueAtTime(freq*.6,t0+dur);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(peak!=null?peak:.2,t0+.01);
  gain.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(t0);osc.stop(t0+dur+.05);
}

/* ---------- helpers ---------- */
function hiWord(ex,word){ // bold the word inside the example
  const base=word.replace(/^\(in\)\s*/,'');
  const re=new RegExp('\\b('+base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','i');
  return re.test(ex)?ex.replace(re,'<b>$1</b>'):ex;
}
function blankWord(ex,word){ // hide the word in the example
  const base=word.replace(/^\(in\)\s*/,'');
  const re=new RegExp('\\b('+base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','i');
  return re.test(ex)?ex.replace(re,'<b>______</b>'):ex;
}
function esc(s){return s.replace(/'/g,"\\'")}
function updProg(){
  const total=allWords().length,m=masteredCount();
  document.getElementById('pKnown').textContent=m;
  document.getElementById('pTotal').textContent=total;
  document.getElementById('pFill').style.width=(total?100*m/total:0)+'%';
}

function parseWordText(txt){
  txt=txt.trim().replace(/```[a-z]*\n?/gi,'').replace(/```/g,'').trim().replace(/,\s*$/,'');
  /* try array format first */
  let t=txt;
  if(!t.startsWith('['))t='['+t;
  if(!/^\[\s*\[/.test(t))t='['+t+']';
  if(!t.endsWith(']'))t=t+']';
  let arr=null;
  try{arr=JSON.parse(t)}catch(e){try{arr=Function('return '+t)()}catch(e2){arr=null}}
  if(Array.isArray(arr)&&typeof arr[0]==='string')arr=[arr];
  if(Array.isArray(arr)&&Array.isArray(arr[0]))return arr;
  /* fallback: simple lines "word, type, معنى, example" or "word - معنى" */
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out=[];
  for(const l of lines){
    let parts=l.includes('\t')?l.split('\t'):l.includes(' - ')?l.split(' - '):l.split(',');
    parts=parts.map(p=>p.trim()).filter(Boolean);
    if(parts.length>=2){
      if(parts.length===2)out.push(['MY',parts[0],'n',parts[1],'']);
      else out.push(['MY',parts[0],parts[1],parts[2]||'\u2014',parts.slice(3).join(', ')||'']);
    }
  }
  return out.length?out:null;
}
function applyImport(arr,msg){
  if(!arr){msg.textContent='Could not read the format \u2014 make sure you copied the full lines from Claude.';return}
  const sel=document.getElementById('mDeck');
  const deck=sel?sel.value:'MY';
  let added=0,skipped=0;
  for(const w of arr){
    if(!Array.isArray(w)||w.length<4)continue;
    const word=String(w[1]).trim();
    if(!word)continue;
    if(myWords.some(x=>x[0]===deck&&x[1].toLowerCase()===word.toLowerCase())){skipped++;continue}
    myWords.unshift([deck,word,String(w[2]||'n'),String(w[3]||'\u2014'),String(w[4]||'')]);
    added++;
  }
  if(added){saveMy();updProg();rebuildUnits();renderMy();
    document.getElementById('mPasteMsg').textContent=`\u2713 Added ${added} word${added>1?'s':''}${skipped?` (${skipped} already existed)`:''}`;
  }else{
    msg.textContent=skipped?'All of these words already exist.':'No valid words found.';
  }
}
function pasteImport(){
  const box=document.getElementById('mPaste'),msg=document.getElementById('mPasteMsg');
  const txt=box.value.trim();
  if(!txt){msg.textContent='Paste the words first.';return}
  applyImport(parseWordText(txt),msg);
}
function fileImport(input){
  const msg=document.getElementById('mPasteMsg');
  const f=input.files&&input.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>applyImport(parseWordText(String(r.result)),msg);
  r.onerror=()=>{msg.textContent='Could not read the file.'};
  r.readAsText(f);
  input.value='';
}
function delMy(word,unit){
  myWords=myWords.filter(w=>!(w[1]===word&&(unit===undefined||w[0]===unit)));
  saveMy();updProg();rebuildUnits();
  if(curTab==='my')renderMy();else renderList();
}

/* ---------- dictionary lookup ---------- */
const POSMAP={noun:'n',verb:'v',adjective:'adj',adverb:'adv',pronoun:'pron',preposition:'prep',conjunction:'conj',interjection:'excl',exclamation:'excl',determiner:'det'};
function renderDict(){
  const el=document.getElementById('p-dict');
  if(el.dataset.ready)return;el.dataset.ready='1';
  el.innerHTML=`<div class="dwrap">
    <div class="dsearch">
      <input class="search" id="dIn" placeholder="Type any English word..." autocomplete="off" autocapitalize="off">
      <button class="next dbtn" onclick="dictLookup()">Search</button>
    </div>
    <div id="dOut"><div class="empty">Look up any English word — definition, pronunciation, examples, synonyms and its Arabic meaning.</div></div>
  </div>`;
  document.getElementById('dIn').addEventListener('keydown',e=>{if(e.key==='Enter')dictLookup()});
}
async function dictLookup(){
  const q=document.getElementById('dIn').value.trim().toLowerCase();
  const out=document.getElementById('dOut');
  if(!q)return;
  out.innerHTML='<div class="empty">Searching\u2026</div>';
  try{
    const [dr,tr]=await Promise.all([
      fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q)).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=en|ar').then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(!dr||!Array.isArray(dr)||!dr.length){out.innerHTML=`<div class="empty">No results for \u201c${q}\u201d. Check the spelling and try again.</div>`;return}
    const e0=dr[0];
    let ar=tr&&tr.responseData&&tr.responseData.translatedText?tr.responseData.translatedText:'';
    if(ar&&ar.toLowerCase()===q)ar='';
    const phonObj=(e0.phonetics||[]).find(p=>p.text);
    const phon=phonObj?phonObj.text:(e0.phonetic||'');
    const audObj=(e0.phonetics||[]).find(p=>p.audio);
    const audio=audObj?audObj.audio:'';
    /* collect examples from ALL entries, not just the first */
    let allEx=[];
    dr.forEach(en=>(en.meanings||[]).forEach(m=>(m.definitions||[]).forEach(d=>{if(d.example&&!allEx.includes(d.example))allEx.push(d.example)})));
    let firstEx=allEx[0]||'';
    const meanings=(e0.meanings||[]).slice(0,3).map(m=>{
      const defs=(m.definitions||[]).slice(0,2).map(d=>{
        return `<li>${d.definition}${d.example?`<div class="dex">\u201c${d.example}\u201d</div>`:''}</li>`;
      }).join('');
      const syns=(m.synonyms||[]).slice(0,6);
      return `<div class="dpos"><div class="dposname">${m.partOfSpeech}</div><ul>${defs}</ul>
        ${syns.length?`<div class="dsyn">${syns.map(x=>`<button class="rchip" onclick="dictFrom('${esc(x)}')">${x}</button>`).join('')}</div>`:''}</div>`;
    }).join('');
    window._dictAdd={w:e0.word||q,ar:ar,ty:POSMAP[(e0.meanings&&e0.meanings[0]&&e0.meanings[0].partOfSpeech)||'']||'n',ex:firstEx};
    const exHtml=allEx.length?`<div class="dpos"><div class="dposname">examples</div><ul>${allEx.slice(0,3).map(x=>`<li><div class="dex">\u201c${x}\u201d</div></li>`).join('')}</ul></div>`:`<div class="dpos" id="dExtraEx"><div class="dposname">examples</div><ul><li><div class="dex" style="opacity:.6">Loading examples\u2026</div></li></ul></div>`;
    out.innerHTML=`<div class="dcard">
      <div class="dhead">
        <div><div class="dword">${e0.word||q}</div>${phon?`<div class="dphon">${phon}</div>`:''}</div>
        <button class="iconbtn" onclick="${audio?`new Audio('${audio}').play()`:`speak('${esc(q)}')`}">${SPK}<span>Listen</span></button>
      </div>
      ${ar?`<div class="dar">${ar}</div>`:''}
      ${meanings}
      ${exHtml}
      <button class="next" style="margin-top:16px" onclick="dictAdd(this)">Add to My Words</button>
    </div>`;
    if(!allEx.length)fetchExamples(q);
  }catch(err){out.innerHTML='<div class="empty">Could not reach the dictionary. Check your connection and try again.</div>'}
}
async function fetchExamples(q){
  const box=document.getElementById('dExtraEx');if(!box)return;
  try{
    const r=await fetch('https://tatoeba.org/en/api_v0/search?from=eng&query='+encodeURIComponent('"'+q+'"')+'&sort=relevance&limit=5').then(x=>x.ok?x.json():null).catch(()=>null);
    const sents=(r&&r.results?r.results:[]).map(s=>s.text).filter(t=>t&&t.length<110&&t.toLowerCase().includes(q.toLowerCase())).slice(0,3);
    if(sents.length){
      box.querySelector('ul').innerHTML=sents.map(x=>`<li><div class="dex">\u201c${x}\u201d</div></li>`).join('');
      if(window._dictAdd&&!window._dictAdd.ex)window._dictAdd.ex=sents[0];
    }else{box.remove()}
  }catch(e){if(box)box.remove()}
}
function dictFrom(w){document.getElementById('dIn').value=w;dictLookup()}
function dictAdd(btn){
  const d=window._dictAdd;if(!d)return;
  if(!myWords.some(x=>x[1].toLowerCase()===d.w.toLowerCase())){
    myWords.unshift(["MY",d.w,d.ty,d.ar||'\u2014',d.ex||'']);
    saveMy();updProg();rebuildUnits();
  }
  btn.textContent='Added to My Words \u2713';btn.disabled=true;
}

/* ---------- home / categories / motivation ---------- */
let picked=false,editMode=false;
const QUOTES=['Little by little, a little becomes a lot.','Consistency beats intensity.','Every new word is a small door.','Five words a day is 1,800 a year.','Read. Repeat. Remember.','Slow is smooth — smooth is fast.','You are one word closer than yesterday.','First we shape our habits, then they shape us.'];
const PRAISE=['Nice work — keep the streak alive.','Solid round. Progress compounds.','Better than yesterday.','That is how it is done.','One round closer to fluent.','Your effort is quietly adding up.'];
function praise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)]}
const CARDS=[
 {id:'OA1',t:'Oxford A1',badge:'A1',cls:'lv-a1',sub:'Beginner'},
 {id:'OA2',t:'Oxford A2',badge:'A2',cls:'lv-a2',sub:'Elementary'},
 {id:'OB1',t:'Oxford B1',badge:'B1',cls:'lv-b1',sub:'Intermediate'},
 {id:'OB2',t:'Oxford B2',badge:'B2',cls:'lv-b2',sub:'Upper-intermediate'},
 {id:'MY',t:'My Words',badge:'MY',cls:'lv-my',sub:'Your personal list'}
];
/* ---------- custom decks ---------- */
let myDecks=JSON.parse(store.get('engl01_decks')||'[]');
function saveDecks(){store.set('engl01_decks',JSON.stringify(myDecks))}
function allCards(){return CARDS.concat(myDecks.map(d=>({id:d.id,t:d.t,badge:d.badge,cls:'lv-my',sub:'Custom deck'})))}
function deckName(id){const d=myDecks.find(x=>x.id===id);return d?d.t:id}
function newDeck(){
  const name=prompt('Deck name (e.g. Podcast Words):');
  if(!name||!name.trim())return;
  const t=name.trim();
  if(myDecks.some(d=>d.t.toLowerCase()===t.toLowerCase())){alert('A deck with this name already exists.');return}
  const badge=t.replace(/[^A-Za-z\u0600-\u06FF0-9]/g,'').slice(0,2).toUpperCase()||'CD';
  myDecks.push({id:'C'+Date.now(),t:t,badge:badge});
  saveDecks();rebuildUnits();renderHome();
}
function deleteDeck(id){
  const d=myDecks.find(x=>x.id===id);if(!d)return;
  const n=myWords.filter(w=>w[0]===id).length;
  if(!confirm(`Delete deck "${d.t}"${n?` and its ${n} word${n>1?'s':''}`:''}? This cannot be undone.`))return;
  myDecks=myDecks.filter(x=>x.id!==id);
  myWords=myWords.filter(w=>w[0]!==id);
  saveDecks();saveMy();rebuildUnits();updProg();renderHome();
}
function unitsOf(s){return [...new Set(W.concat(OX).map(w=>w[0]))].filter(u=>u[0]===s)}
function cardUnits(id){if(id==='L'||id==='R')return unitsOf(id);if(id==='MY')return['MY'];return[id]}
function cardHidden(id){const us=cardUnits(id);return us.length>0&&us.every(u=>hidden.has(u))}
function cardCounts(id){
  const us=new Set(cardUnits(id));
  const list=W.concat(OX).concat(myWords).filter(w=>us.has(w[0]));
  const k=list.filter(w=>known.has(kid(w))).length;
  return [list.length,k];
}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function cardsHTML(edit){
  const html=allCards().filter(c=>!cardHidden(c.id)).map((c,i)=>{
    const cnt=cardCounts(c.id),tot=cnt[0],k=cnt[1];
    const isCustom=c.id[0]==='C';
    const click=edit?'':((c.id==='MY'||isCustom)&&!tot?"goTab('my')":`pickCat('${c.id}')`);
    const del=edit&&c.id!=='MY'?`<button class="delbadge" onclick="event.stopPropagation();${isCustom?`deleteDeck('${c.id}')`:`hideCard('${c.id}')`}">✕</button>`:'';
    return `<div class="hcard${edit?' wig':''}" style="animation-delay:${i*60}ms" onclick="${click}">
      ${del}
      <span class="lvl ${c.cls}">${c.badge}</span><div class="ht">${c.t}</div><div class="hsub">${c.sub}</div>
      <div class="hcount">${tot?k+' / '+tot+' mastered':'Add your first word'}</div>
      <div class="hbar"><i style="width:${tot?100*k/tot:0}%"></i></div>
    </div>`;
  }).join('');
  const addTile=edit?'':`<div class="hcard" style="display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;min-height:120px" onclick="newDeck()">
    <span style="font-size:30px;line-height:1">＋</span>
    <div class="ht" style="margin-top:6px">New deck</div>
    <div class="hsub">Create a custom category</div>
  </div>`;
  return html+addTile;
}
function guardHTML(){return '<div class="empty">Choose a deck to begin.</div><div class="hgrid">'+cardsHTML(false)+'</div>'}
function renderHome(){
  const el=document.getElementById('p-home');
  const total=allWords().length;
  const hiddenCards=allCards().filter(c=>c.id!=='MY'&&c.id[0]!=='C'&&cardHidden(c.id));
  el.innerHTML=`<div class="home">
    <div class="eyebrow">${greeting()} \u00b7 Daily practice</div>
    <div class="hgreet">Hello, ${userName||'there'}</div>
    <div class="hquote">${QUOTES[Math.floor(Math.random()*QUOTES.length)]}</div>
    ${streakHTML()}
    <div class="hprog"><span><b>${masteredCount()}</b> of ${total} words mastered</span><div class="pbar"><i style="width:${total?100*masteredCount()/total:0}%"></i></div></div>
    <div class="hhead"><h3>Decks</h3><button class="iconbtn" onclick="editMode=!editMode;renderHome()">${editMode?'Done':'Edit'}</button></div>
    <div class="hgrid" id="hgrid">${cardsHTML(editMode)}</div>
    ${hiddenCards.length?`<div class="hhead" style="margin-top:16px"><h3>Hidden decks</h3></div><div class="hrestore">${hiddenCards.map(c=>`<button class="rchip" onclick="restoreCard('${c.id}')">${c.t} — Restore</button>`).join('')}</div>`:''}
  </div>`;
  attachLongPress();
}
function attachLongPress(){
  const g=document.getElementById('hgrid');if(!g)return;let t=null;
  g.addEventListener('touchstart',()=>{t=setTimeout(()=>{if(!editMode){editMode=true;renderHome();if(navigator.vibrate)navigator.vibrate(30)}},550)},{passive:true});
  g.addEventListener('touchend',()=>clearTimeout(t),{passive:true});
  g.addEventListener('touchmove',()=>clearTimeout(t),{passive:true});
  g.addEventListener('contextmenu',e=>e.preventDefault());
}
function hideCard(id){cardUnits(id).forEach(u=>hidden.add(u));saveHidden();rebuildUnits();updProg();renderHome()}
function restoreCard(id){cardUnits(id).forEach(u=>hidden.delete(u));saveHidden();rebuildUnits();updProg();renderHome()}
function goTab(p){document.querySelector(`.tab[data-p="${p}"]`).click()}
function pickCat(id){
  picked=true;
  if(id==='L'||id==='R'){fSrc.value=id;rebuildUnits();fUnit.value='all'}
  else if(id==='MY'){fSrc.value='M';rebuildUnits();fUnit.value='all'}
  else if(id[0]==='C'){fSrc.value='C';rebuildUnits();fUnit.value=id}
  else{fSrc.value='O';rebuildUnits();fUnit.value=id}
  goTab('list');
}


/* ---------- user name onboarding ---------- */
let userName=store.get('engl01_name')||'';
function askName(change){
  if(document.getElementById('nameov'))return;
  const ov=document.createElement('div');ov.className='nameov';ov.id='nameov';
  ov.innerHTML=`<div class="namecard">
    <div class="nbrand">ENG<span class="tld">.</span></div>
    <h2>${change?'Change your name':'Welcome'}</h2>
    <p>${change?'Update the name we greet you with.':'What should we call you?'}</p>
    <input class="search" id="nameIn" maxlength="20" placeholder="Your name" value="${userName}">
    <button class="next" onclick="saveName()">${change?'Save':'Start learning'}</button>
  </div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{const i=document.getElementById('nameIn');if(!i)return;i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')saveName()})},60);
}
function saveName(){
  const v=document.getElementById('nameIn').value.trim().replace(/[<>"'`]/g,'').slice(0,20);
  if(!v)return;
  userName=v;store.set('engl01_name',v);
  document.getElementById('nameov').remove();
  applyName();if(curTab==='home')renderHome();
}
function applyName(){
  const s=document.querySelector('h1 small');
  if(!userName)return;
  s.textContent=userName;s.style.cursor='pointer';s.title='Change name';
  s.onclick=()=>askName(true);
}
if(userName)applyName();else askName(false);

rebuildUnits();updProg();renderHome();
</script>
</body>
</html>
