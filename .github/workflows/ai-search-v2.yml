name: Apply AI search v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-search-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch AI search and dialect pronunciation
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
          node --check api/ai.js
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/voclab-inline.js').write_text('\\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)),encoding='utf-8')"
          node --check /tmp/voclab-inline.js
          git diff --check
      - name: Commit feature and remove temporary workflow
        shell: bash
        run: |
          git config user.name "voclab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html api/ai.js
          git rm .github/workflows/ai-search-v2.yml
          git commit -m "Replace dictionary with AI search and US UK pronunciation"
          git push origin main
