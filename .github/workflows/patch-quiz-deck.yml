name: Patch quiz deck direct start
on:
  push:
    branches: [fix/quiz-deck-direct-start]
    paths: ['.github/workflows/patch-quiz-deck.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quiz-deck-direct-start
      - name: Patch quiz deck selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="  goTab('list');\n}\n\n\n/* ---------- user name onboarding ---------- */"
          new="  // If the deck was chosen from the Quiz screen, start that quiz immediately.\n  // startMcq() snapshots pool() into qDeck, so every distractor stays inside this deck.\n  if(curTab==='mcq'){\n    startMcq();\n    try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}\n    return;\n  }\n  goTab('list');\n}\n\n\n/* ---------- user name onboarding ---------- */"
          if old not in s: raise SystemExit('pickCat tail not found; refusing to patch')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          grep -n "If the deck was chosen from the Quiz screen" index.html
      - name: Commit patch
        run: |
          git config user.name "voclab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Start quiz immediately after deck selection"
          git push origin HEAD:fix/quiz-deck-direct-start
