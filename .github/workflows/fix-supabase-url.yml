name: Fix Supabase URL typo

on:
  push:
    branches:
      - fix/supabase-url

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supabase-url
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Supabase URL
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='auth.js';
          let s=fs.readFileSync(p,'utf8');
          const bad='https://hknecvleujjdyogtwaar.supabase.co';
          const good='https://hknecvleujjdyoqtwaar.supabase.co';
          if(!s.includes(bad)) throw new Error('Expected typo not found');
          s=s.replace(bad,good);
          fs.writeFileSync(p,s);
          NODE
      - name: Validate
        run: |
          node --check auth.js
          grep -q "https://hknecvleujjdyoqtwaar.supabase.co" auth.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth.js
          git commit -m "Fix Supabase project URL"
          git push origin HEAD:fix/supabase-url
