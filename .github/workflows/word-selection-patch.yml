name: Apply word selection management

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/word-selection-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and validate
        shell: bash
        run: |
          python3 .github/word_selection_patch.py
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); pathlib.Path('/tmp/voclab-inline.js').write_text('\\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))"
          node --check /tmp/voclab-inline.js
          git diff --check
      - name: Commit feature and remove temporary files
        shell: bash
        run: |
          git config user.name "voclab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/word-selection-patch.yml .github/word_selection_patch.py
          git commit -m "Add word selection delete and move tools"
          git push origin main
