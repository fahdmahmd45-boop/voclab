name: Fix OTP send error mapping

on:
  push:
    branches:
      - fix/otp-send-error

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/otp-send-error
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch OTP error handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('auth.js')
          s = p.read_text()
          old = "if (lower.includes('token') || lower.includes('otp') || lower.includes('invalid')) return 'That verification code is incorrect or expired. Please request a new code.';"
          new = "if (lower.includes('token') || lower.includes('otp') || lower.includes('invalid')) return raw;"
          if old not in s:
              raise SystemExit('Expected OTP error mapping not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          node --check auth.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth.js
          git commit -m "Show exact OTP send errors"
          git push origin HEAD:fix/otp-send-error
