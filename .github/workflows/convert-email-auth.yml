name: Convert auth to email

on:
  push:
    branches:
      - feat/email-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/email-auth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Convert phone auth UI to email auth
        run: python3 scripts/convert_email_auth.py
      - name: Validate
        run: |
          node --check auth.js
          git diff --check
          grep -q "Continue with email" auth.js
          grep -q "signInWithOtp({ email" auth.js
          grep -q "verifyOtp({ email" auth.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth.js
          git commit -m "Switch sign in from phone to email"
          git push origin HEAD:feat/email-auth
