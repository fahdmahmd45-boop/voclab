name: Apply AI Add Word

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply frontend patch
        run: python3 .github/scripts/patch_ai_addword.py
      - name: Validate and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          inline='\n'.join(b for b in blocks if b.strip())
          Path('/tmp/voclab-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/voclab-inline.js
          node --check api/ai.js
          git diff --check
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add AI word and file vocabulary import"
          git push
