name: Validate security hardening
on:
  push:
    branches:
      - security/harden-ai-xss
    paths:
      - .github/workflows/patch-security-hardening.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-ai-xss
      - name: Validate hardened source
        run: |
          git diff --check HEAD^
          if grep -q "Function('return '+t)" index.html; then echo "unsafe dynamic code execution remains"; exit 1; fi
          grep -n "function htmlText" index.html
          grep -n "Sign in to use AI" index.html
          node --check api/ai.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text()
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S|re.I)
          Path('/tmp/voclab-inline.js').write_text('\n;\n'.join(blocks))
          PY
          node --check /tmp/voclab-inline.js
