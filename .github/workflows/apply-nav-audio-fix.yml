name: Apply navigation and audio fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/patch_nav_audio.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          inline='\n'.join(b for b in blocks if b.strip())
          Path('/tmp/voclab-inline.js').write_text(inline,encoding='utf-8')
          print('Inline JS bytes:',len(inline.encode('utf-8')))
          PY
          node --check /tmp/voclab-inline.js
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore flashcard sounds and add Home/Exit navigation"
          git push
