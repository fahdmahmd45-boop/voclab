name: Security hardening
on:
  push:
    paths:
      - '.github/security_hardening_patch.py'
      - '.github/workflows/security-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/security_hardening_patch.py
      - name: Validate API JavaScript
        run: node --check api/ai.js
      - name: Validate Vercel config
        run: python3 -m json.tool vercel.json >/dev/null
      - name: Validate diff
        run: git diff --check
      - name: Commit hardening and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ai.js vercel.json
          git rm .github/security_hardening_patch.py .github/workflows/security-hardening.yml
          git commit -m "Harden AI quota and browser security"
          git push
