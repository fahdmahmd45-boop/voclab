name: Install deck mode navigation
on:
  push:
    branches: [fix/deck-mode-back]
    paths:
      - '.github/workflows/install-deck-mode-navigation.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install isolated loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          loader='<script src="/assets/deck-mode-navigation.js"></script>'
          anchor='<script src="/assets/inline-script-1.js"></script>'
          if loader in s:
              raise SystemExit('loader already installed')
          if s.count(anchor) != 1:
              raise SystemExit('expected exactly one app script anchor')
          s=s.replace(anchor, anchor+'\n'+loader, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate isolated change
        run: |
          node --check assets/deck-mode-navigation.js
          grep -F '<script src="/assets/inline-script-1.js"></script>' index.html
          grep -F '<script src="/assets/deck-mode-navigation.js"></script>' index.html
          test "$(grep -F -c '<script src="/assets/deck-mode-navigation.js"></script>' index.html)" = "1"
          git diff --check
      - name: Commit tested loader
        run: |
          rm -f .github/workflows/install-deck-mode-navigation.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "voclab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Enable safe deck picker back navigation"
          git push origin fix/deck-mode-back
