name: Patch security hardening
on:
  push:
    branches:
      - security/harden-ai-xss
    paths:
      - scripts/patch-security.py
      - .github/workflows/patch-security-hardening.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-ai-xss
      - name: Apply security patch
        run: python3 scripts/patch-security.py
      - name: Validate patch
        run: |
          git diff --check
          grep -n "function htmlText" index.html
          grep -n "Sign in to use AI" index.html
          if grep -q "Function('return '+t)" index.html; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name "voclab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Escape imported vocabulary and remove dynamic code execution"
          git push origin HEAD:security/harden-ai-xss
