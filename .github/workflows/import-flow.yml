name: Import flow checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm install --no-save --ignore-scripts jsdom@26
      - run: node --test tests/import-flow.test.js
      - run: node --check assets/import-learn.js
